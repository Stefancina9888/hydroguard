[project]
name = "hydroguard"
version = "0.1.0"
description = "Hydraulic pump leakage diagnosis: reproducible dataset acquisition and audit"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["numpy>=2.0,<3"]

[dependency-groups]
dev = [{ include-group = "baseline" }, "pytest>=8,<10", "ruff>=0.9,<1"]
baseline = ["pandas>=2.2,<3", "scikit-learn>=1.9,<1.10"]
eda = [
    "pandas>=2.2,<3",
    "matplotlib>=3.9,<4",
    "scikit-learn>=1.5,<2",
    "nbformat>=5.10,<6",
    "nbclient>=0.10,<1",
    "ipykernel>=6,<8",
]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
