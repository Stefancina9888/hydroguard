[project]
name = "hydroguard-serving"
version = "1.0.0"
description = "Local academic demonstration of the locked HydroGuard Phase 3B model"
requires-python = "==3.11.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.10,<3",
    "numpy==2.4.6",
    "pandas==2.3.3",
    "scikit-learn==1.9.1",
    "scipy==1.17.1",
    "threadpoolctl==3.7.0",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hydroguard_serving"]

# Package only the four unchanged historical modules needed for inference.
# No dependency on the root project's pyproject.toml or training package install.
[tool.hatch.build.targets.wheel.force-include]
"../src/hydroguard/__init__.py" = "hydroguard/__init__.py"
"../src/hydroguard/data.py" = "hydroguard/data.py"
"../src/hydroguard/features.py" = "hydroguard/features.py"
"../src/hydroguard/inference.py" = "hydroguard/inference.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
